apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gopher-office
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/o-ga09/infra
    targetRevision: main
    path: manifests/gopher-office
  destination:
    server: https://kubernetes.default.svc
    namespace: gopher-office
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
    # Fleet / FleetAutoscaler は Agones の CRD。Agones が先に入っていなくても、後から再試行して揃うようにする
    - SkipDryRunOnMissingResource=true
