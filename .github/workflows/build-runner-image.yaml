name: build-runner-image

on:
  push:
    branches: [main]
    paths: [runner-image/**]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: runner-image
          push: true
          tags: |
            ghcr.io/o-ga09/arc-runner:latest
            ghcr.io/o-ga09/arc-runner:${{ github.sha }}
