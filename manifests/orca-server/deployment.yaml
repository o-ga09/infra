apiVersion: apps/v1
kind: Deployment
metadata:
  name: orca-server
  namespace: orca-server
spec:
  replicas: 1
  revisionHistoryLimit: 2
  # 同じ /data を 2 つの Pod が同時に使うとロックで起動しないため、必ず Recreate にする
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: orca-server
  template:
    metadata:
      labels:
        app: orca-server
    spec:
      # コントロールプレーン（メモリ 4GiB で 75% 使用）を避け、agent に固定する。
      # local-path の PVC もノードに固定されるため、ここで明示しておく
      nodeSelector:
        kubernetes.io/hostname: k3s-agent
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: orca-server
        image: ghcr.io/o-ga09/orca-server:68c6b3b6acde41a21cc354d0987295ecc4cb5b57
        ports:
        - containerPort: 6768
          name: orca
        env:
        - name: ORCA_PORT
          value: "6768"
        # git の https 認証に gh を使う（GH_TOKEN は orca-secrets から渡す。イメージには焼かない）
        - name: GIT_CONFIG_COUNT
          value: "2"
        - name: GIT_CONFIG_KEY_0
          value: "credential.https://github.com.helper"
        - name: GIT_CONFIG_VALUE_0
          value: ""
        - name: GIT_CONFIG_KEY_1
          value: "credential.https://github.com.helper"
        - name: GIT_CONFIG_VALUE_1
          value: "!gh auth git-credential"
        # Secret が未作成でも Pod が起動できるよう optional にしている
        envFrom:
        - secretRef:
            name: orca-secrets
            optional: true
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
        volumeMounts:
        - name: data
          mountPath: /data
        - name: work
          mountPath: /work
        # Pod 既定の /dev/shm（64MB）だと Playwright の Chromium がクラッシュするため差し替える
        - name: dshm
          mountPath: /dev/shm
        readinessProbe:
          tcpSocket:
            port: orca
          initialDelaySeconds: 10
          periodSeconds: 10
        livenessProbe:
          tcpSocket:
            port: orca
          initialDelaySeconds: 60
          periodSeconds: 30
          failureThreshold: 5
        resources:
          requests:
            cpu: "250m"
            memory: "1Gi"
          limits:
            cpu: "2"
            memory: "4Gi"
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: orca-data
      - name: work
        persistentVolumeClaim:
          claimName: orca-work
      # メモリ上の tmpfs。使用量はコンテナの memory limit に計上される
      - name: dshm
        emptyDir:
          medium: Memory
          sizeLimit: 1Gi
