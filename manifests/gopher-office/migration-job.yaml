# 同期の前に、スキーマのマイグレーションを 1 回だけ実行する（MySQL の GET_LOCK で、同時に走っても直列になる）
apiVersion: batch/v1
kind: Job
metadata:
  name: office-migration
  namespace: gopher-office
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      containers:
      - name: migration
        image: ghcr.io/o-ga09/gopher-office/api:main
        imagePullPolicy: Always
        command: ["/migrate"]
        env:
        - name: MYSQL_DSN
          valueFrom:
            secretKeyRef:
              name: office-secret
              key: MYSQL_DSN
        resources:
          requests:
            memory: "32Mi"
            cpu: "50m"
          limits:
            memory: "128Mi"
            cpu: "200m"
