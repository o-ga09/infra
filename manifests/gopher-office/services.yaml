apiVersion: v1
kind: Service
metadata:
  name: office-api
  namespace: gopher-office
spec:
  selector:
    app: office-api
  ports:
  - port: 8080
    targetPort: 8080
    name: http
---
apiVersion: v1
kind: Service
metadata:
  name: office-gateway
  namespace: gopher-office
spec:
  selector:
    app: office-gateway
  ports:
  - port: 8081
    targetPort: 8081
    name: http
---
apiVersion: v1
kind: Service
metadata:
  name: office-web
  namespace: gopher-office
spec:
  selector:
    app: office-web
  ports:
  - port: 8080
    targetPort: 8080
    name: http
