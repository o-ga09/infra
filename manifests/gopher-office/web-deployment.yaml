apiVersion: apps/v1
kind: Deployment
metadata:
  name: office-web
  namespace: gopher-office
spec:
  replicas: 1
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app: office-web
  template:
    metadata:
      labels:
        app: office-web
    spec:
      containers:
      - name: office-web
        image: ghcr.io/o-ga09/gopher-office/web:main
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
        readinessProbe:
          httpGet:
            path: /healthz
            port: 8080
          periodSeconds: 5
        resources:
          requests:
            memory: "32Mi"
            cpu: "20m"
          limits:
            memory: "128Mi"
            cpu: "200m"
