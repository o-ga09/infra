apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-alerting-cleanup
  namespace: monitoring
  labels:
    grafana_alert: "1"
data:
  cleanup.yaml: |
    # 旧アラート設定を Grafana から削除するための一時的なプロビジョニング。
    # 反映を確認したらこの ConfigMap ごと削除する。
    apiVersion: 1
    deleteRules:
      - orgId: 1
        uid: mh-api-high-error-rate
      - orgId: 1
        uid: mh-api-high-latency
      - orgId: 1
        uid: line-bot-high-error-rate
      - orgId: 1
        uid: node-high-cpu-usage
      - orgId: 1
        uid: node-high-memory-usage
      - orgId: 1
        uid: node-high-disk-usage
      - orgId: 1
        uid: node-exporter-down
    deleteContactPoints:
      - orgId: 1
        uid: slack-receiver
      - orgId: 1
        uid: slack-receiver-apps
    resetPolicies:
      - 1
